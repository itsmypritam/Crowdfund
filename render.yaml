services:
  - type: web
    name: crowdescrow
    runtime: node
    repo: https://github.com/itsmypritam/Crowdfund
    branch: master
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: STELLAR_NETWORK
        value: testnet
      - key: DATA_FILE
        value: /var/data/db.sqlite
      - key: CORS_ORIGINS
        value: https://warriorpinto-6k1ikg.stormkit.dev,http://localhost:4321
      - key: LOG_LEVEL
        value: info
      - key: VERIFY_DONATIONS
        value: "1"
      - key: CONTRACT_ID
        sync: false
      - key: ADMIN_KEY
        sync: false
      # Upstash Redis connection string for the BullMQ notification queue
      # (set this manually in Render — it contains a secret, never commit it)
      # rediss://default:<UPSTASH_REST_TOKEN>@<your-db>.upstash.io:6380
      - key: REDIS_URL
        sync: false
    disks:
      - name: crowdescrow-data
        mountPath: /var/data
        sizeGB: 1
